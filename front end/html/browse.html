<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIXORA — استكشف المكتبة</title>

    <!-- 🛑 حظر التوجيه التلقائي وتثبيت بيانات الجلسة -->
    <script>
        localStorage.setItem('isLoggedIn', 'true');
        localStorage.setItem('loggedIn', 'true');
        localStorage.setItem('flixora_token', 'demo_active_token');

        // منع أي محاولة تحويل لصفحة login.html
        window.addEventListener('beforeunload', function (e) {
            if (document.activeElement && document.activeElement.href && document.activeElement.href.includes('login.html')) {
                e.preventDefault();
            }
        });
    </script>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="padding-top: 80px; background: #060608; min-height: 100vh; color: #fff;">

    <!-- Navigation Header -->
    <nav class="navbar" style="position: fixed; top: 0; width: 100%; z-index: 1000; background: rgba(6, 6, 8, 0.85); backdrop-filter: blur(15px); border-bottom: 1px solid #222;">
        <div style="display: flex; align-items: center; gap: 3rem; padding: 0.8rem 2rem;">
            <a href="home.html" class="logo" style="text-decoration: none; color: #fff; font-weight: bold; font-size: 1.5rem;">
                <i class="fa-solid fa-film" style="color: #d4af37;"></i> FLIXORA<span style="color: #d4af37;">.</span>
            </a>
            <ul class="nav-links" style="display: flex; gap: 1.8rem; list-style: none; margin: 0;">
                <li><a href="home.html" style="color: #aaa; text-decoration: none;"><i class="fa-solid fa-house"></i> الرئيسية</a></li>
                <li><a href="browse.html" class="active" style="color: #d4af37; text-decoration: none;"><i class="fa-solid fa-compass"></i> استكشف</a></li>
                <li><a href="trending.html" style="color: #aaa; text-decoration: none;"><i class="fa-solid fa-fire"></i> الأحدث</a></li>
                <li><a href="ai-assistant.html" style="color: #aaa; text-decoration: none;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Assistant</a></li>
                <li><a href="watch-party.html" style="color: #aaa; text-decoration: none;"><i class="fa-solid fa-users"></i> Watch Party</a></li>
                <li><a href="my-list.html" style="color: #aaa; text-decoration: none;"><i class="fa-solid fa-bookmark"></i> قائمتي</a></li>
            </ul>
        </div>
        <div style="display: flex; align-items: center; gap: 1.5rem; padding-left: 2rem;">
            <a href="profile.html" style="display: flex; align-items: center; gap: 0.8rem; text-decoration: none;">
                <img src="https://i.pravatar.cc/100?img=33" alt="User Profile" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #d4af37; object-fit: cover;">
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <main style="padding: 3rem 4rem; max-width: 1400px; margin: 0 auto;">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1.5rem;">
            <div>
                <h1 style="color: #fff; font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem;">استكشف المكتبة 🎬</h1>
                <p style="color: #aaa; font-size: 0.95rem;">تصفح أفضل الأفلام والمسلسلات بحسب التصنيف</p>
            </div>

            <!-- Categories Buttons -->
            <div style="display: flex; gap: 0.8rem; flex-wrap: wrap;">
                <button class="filter-btn active" onclick="filterGenre('all', this)">الكل</button>
                <button class="filter-btn" onclick="filterGenre('scifi', this)">خيال علمي</button>
                <button class="filter-btn" onclick="filterGenre('action', this)">أكشن</button>
                <button class="filter-btn" onclick="filterGenre('drama', this)">دراما</button>
                <button class="filter-btn" onclick="filterGenre('horror', this)">رعب</button>
            </div>
        </div>

        <!-- Movies Grid Container -->
        <div id="movies-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 2rem;">
            <!-- Rendered Dynamically via Script -->
        </div>
    </main>

    <style>
        .filter-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #333;
            color: #fff;
            padding: 0.6rem 1.4rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #d4af37;
            color: #000;
            font-weight: 700;
            border-color: #d4af37;
        }
    </style>

    <!-- Inline Dynamic Logic (خالي من الاعتمادات الخارجية للثبات) -->
    <script>
        const moviesList = [
            { id: 1, title: 'Interstellar', genre: 'scifi', rating: '8.7', year: '2014', poster: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=400' },
            { id: 2, title: 'Inception', genre: 'scifi', rating: '8.8', year: '2010', poster: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=400' },
            { id: 3, title: 'The Dark Knight', genre: 'action', rating: '9.0', year: '2008', poster: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?q=80&w=400' },
            { id: 4, title: 'Mad Max: Fury Road', genre: 'action', rating: '8.1', year: '2015', poster: 'https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?q=80&w=400' },
            { id: 5, title: 'Chernobyl', genre: 'drama', rating: '9.4', year: '2019', poster: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=400' },
            { id: 6, title: 'The Conjuring', genre: 'horror', rating: '7.5', year: '2013', poster: 'https://images.unsplash.com/photo-1509248961158-e54f6934749c?q=80&w=400' }
        ];

        function renderMovies(items) {
            const grid = document.getElementById('movies-grid');
            if(!grid) return;

            grid.innerHTML = items.map(m => `
                <div style="background: #12141a; border: 1px solid #222; border-radius: 12px; overflow: hidden; transition: transform 0.3s ease;">
                    <div style="position: relative; aspect-ratio: 2/3;">
                        <img src="${m.poster}" style="width: 100%; height: 100%; object-fit: cover;">
                        <span style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.85); border: 1px solid #d4af37; color: #d4af37; font-size: 0.8rem; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold;">
                            ★ ${m.rating}
                        </span>
                    </div>
                    <div style="padding: 1rem;">
                        <h3 style="color: #fff; font-size: 1rem; margin-bottom: 0.4rem;">${m.title}</h3>
                        <div style="display: flex; justify-content: space-between; align-items: center; color: #aaa; font-size: 0.85rem;">
                            <span>${m.year}</span>
                            <a href="watch.html?id=${m.id}" style="color: #d4af37; text-decoration: none; font-weight: 600;">مشاهدة ▶</a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterGenre(genre, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (genre === 'all') {
                renderMovies(moviesList);
            } else {
                renderMovies(moviesList.filter(m => m.genre === genre));
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderMovies(moviesList);
        });
    </script>
</body>
</html>
